
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>QR Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{width:min(100%,760px);margin:auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
.top h1{font-size:19px;margin:0}
.state{font-size:12px;color:#c8d3e2;background:#263449;border-radius:20px;padding:7px 10px}
.state.on{color:#a8ffc0;background:#123e2a}
.view{position:relative;width:100%;aspect-ratio:3/4;max-height:78vh;min-height:320px;overflow:hidden;border-radius:18px;background:#000;isolation:isolate}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.view canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;color:#dce7f5;text-align:center;padding:24px;pointer-events:none}
.placeholder b{font-size:20px}
.placeholder small{color:#9eacc0}
.controls{display:flex;gap:10px;margin-top:12px}
.btn{border:0;border-radius:12px;min-height:48px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
.start{flex:1;background:#1976e8;color:#fff}
.stop{background:#29374b;color:#fff}
.btn:disabled{opacity:.45}
.result{margin-top:12px;padding:14px;border-radius:14px;background:#1b293c;border:1px solid #30435d;min-height:64px}
.result .label{color:#9eafc5;font-size:12px;margin-bottom:6px}
.result .value{font-size:15px;line-height:1.45;overflow-wrap:anywhere;color:#a7ffbd;font-weight:700}
.hint{color:#9eafc5;font-size:12px;line-height:1.5;text-align:center;margin:12px 4px 0}
.hidden{display:none!important}
@media(min-width:600px){
.app{padding:22px}
.view{aspect-ratio:4/3;max-height:600px}
}
</style>
</head>
<body>
<main class="app">
<header class="top">
<h1>QUÉT MÃ QR</h1>
<span id="state" class="state">Chưa bật camera</span>
</header>

<section class="view" id="view">
<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="placeholder" class="placeholder">
<b>📷 Camera QR</b>
<small>Nhấn “Mở camera” để bắt đầu</small>
</div>
</section>

<div class="controls">
<button id="start" class="btn start">MỞ CAMERA SAU</button>
<button id="stop" class="btn stop" disabled>DỪNG</button>
</div>

<section class="result" aria-live="polite">
<div class="label">NỘI DUNG QR ĐANG NHẬN DIỆN</div>
<div id="value" class="value">Chưa phát hiện mã QR.</div>
</section>

<p class="hint">
Cần mở website bằng HTTPS và cho phép quyền Camera.
Đưa mã QR vào vùng camera, giữ đủ sáng và để mã nằm trọn trong hình.
</p>
</main>

<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const video = $('video');
const overlay = $('overlay');
const ctx = overlay.getContext('2d');

let stream = null;
let detector = null;
let engine = '';
let running = false;
let busy = false;
let timer = 0;
let lastFound = 0;
let jsQRLoader = null;

const scanCanvas = document.createElement('canvas');
const scanCtx = scanCanvas.getContext('2d',{
willReadFrequently:true
});

function setState(text,on=false){
$('state').textContent=text;
$('state').className='state'+(on?' on':'');
}

function resizeOverlay(){
const r=$('view').getBoundingClientRect();
const dpr=Math.max(1,window.devicePixelRatio||1);

overlay.width=Math.round(r.width*dpr);
overlay.height=Math.round(r.height*dpr);

ctx.setTransform(dpr,0,0,dpr,0,0);

return {w:r.width,h:r.height};
}

function clearOverlay(){
const s=resizeOverlay();
ctx.clearRect(0,0,s.w,s.h);
}

function videoPointToScreen(p,sourceW,sourceH,screenW,screenH){
const scale=Math.min(screenW/sourceW,screenH/sourceH);
const offsetX=(screenW-sourceW*scale)/2;
const offsetY=(screenH-sourceH*scale)/2;

return {
x:offsetX+p.x*scale,
y:offsetY+p.y*scale
};
}

// Vẽ khung xanh bám theo mã QR.
function showBox(corners,sourceW,sourceH,text){
const s=resizeOverlay();

ctx.clearRect(0,0,s.w,s.h);

const pts=corners.map(p=>
videoPointToScreen(p,sourceW,sourceH,s.w,s.h)
);

if(pts.length>=4){

ctx.beginPath();
ctx.moveTo(pts[0].x,pts[0].y);

for(let i=1;i<pts.length;i++){
ctx.lineTo(pts[i].x,pts[i].y);
}

ctx.closePath();

ctx.fillStyle='rgba(22,255,105,.12)';
ctx.fill();

ctx.strokeStyle='#20ff70';
ctx.lineWidth=4;
ctx.shadowColor='#00ff68';
ctx.shadowBlur=13;
ctx.stroke();
ctx.shadowBlur=0;

for(const p of pts){
ctx.beginPath();
ctx.arc(p.x,p.y,5,0,Math.PI*2);
ctx.fillStyle='#20ff70';
ctx.fill();
}

}

const minX=pts.length?Math.min(...pts.map(p=>p.x)):12;
const minY=pts.length?Math.min(...pts.map(p=>p.y)):36;

const label='QR ĐÃ NHẬN DIỆN';

ctx.font='bold 13px Arial';

const labelW=ctx.measureText(label).width+20;
const lx=Math.max(7,Math.min(minX,s.w-labelW-7));
const ly=Math.max(27,minY-8);

ctx.fillStyle='#0b9c45';
ctx.fillRect(lx,ly-24,labelW,25);

ctx.fillStyle='#fff';
ctx.fillText(label,lx+10,ly-7);

$('value').textContent=text;
lastFound=performance.now();
}

function hideLostBox(){
if(performance.now()-lastFound>300){
clearOverlay();
$('value').textContent='Đưa mã QR vào vùng camera.';
}
}

// Tọa độ QR từ jsQR.
function jsQRPoints(result,canvasW,canvasH){
const l=result.location;

const sx=video.videoWidth/canvasW;
const sy=video.videoHeight/canvasH;

return [
l.topLeftCorner,
l.topRightCorner,
l.bottomRightCorner,
l.bottomLeftCorner
].map(p=>({
x:p.x*sx,
y:p.y*sy
}));
}

// Tọa độ QR từ bộ giải mã trình duyệt.
function nativePoints(result){

if(result.cornerPoints&&result.cornerPoints.length>=4){
return result.cornerPoints.map(p=>({
x:p.x,
y:p.y
}));
}

if(result.boundingBox){

const b=result.boundingBox;

return [
{x:b.x,y:b.y},
{x:b.x+b.width,y:b.y},
{x:b.x+b.width,y:b.y+b.height},
{x:b.x,y:b.y+b.height}
];

}

return [];
}

// Tải jsQR khi thiết bị không hỗ trợ bộ giải mã native.
function loadJsQR(){

if(window.jsQR)return Promise.resolve();
if(jsQRLoader)return jsQRLoader;

jsQRLoader=new Promise((resolve,reject)=>{

const urls=[
'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',
'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'
];

let i=0;

const next=()=>{

if(i>=urls.length){
reject(new Error('Không tải được bộ giải mã QR. Kiểm tra Internet rồi tải lại trang.'));
return;
}

const script=document.createElement('script');
script.src=urls[i++];

script.onload=()=>{
window.jsQR?resolve():next();
};

script.onerror=next;

document.head.appendChild(script);

};

next();

});

return jsQRLoader;
}

// Tự động chọn thuật toán nhanh nhất có sẵn.
async function chooseEngine(){

if(
'BarcodeDetector' in window &&
typeof BarcodeDetector.getSupportedFormats==='function'
){

try{

const supported=await BarcodeDetector.getSupportedFormats();

if(supported.includes('qr_code')){

detector=new BarcodeDetector({
formats:['qr_code']
});

engine='native';
return;

}

}catch(e){}

}

await loadJsQR();
engine='jsqr';

}

// Quét bằng BarcodeDetector.
async function scanNative(){

const found=await detector.detect(video);

if(found&&found.length){

const item=found[0];

const corners=nativePoints(item);

showBox(
corners,
video.videoWidth,
video.videoHeight,
item.rawValue||'QR đã nhận diện'
);

}else{

hideLostBox();

}

}

// Quét bằng jsQR.
function scanWithJsQR(){

const vw=video.videoWidth;
const vh=video.videoHeight;

if(!vw||!vh)return;

// Giới hạn chiều rộng xử lý tối đa 1280px.
const scale=Math.min(1,1280/vw);

const w=Math.max(1,Math.round(vw*scale));
const h=Math.max(1,Math.round(vh*scale));

if(scanCanvas.width!==w||scanCanvas.height!==h){
scanCanvas.width=w;
scanCanvas.height=h;
}

scanCtx.drawImage(video,0,0,w,h);

const image=scanCtx.getImageData(0,0,w,h);

// Ưu tiên tốc độ giải mã QR thông thường.
const result=window.jsQR(
image.data,
w,
h,
{inversionAttempts:'dontInvert'}
);

if(result){

showBox(
jsQRPoints(result,w,h),
vw,
vh,
result.data
);

}else{

hideLostBox();

}

}

// Vòng quét liên tục, không cho chạy chồng.
async function scanLoop(){

if(!running||busy)return;

busy=true;

try{

if(video.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA){

if(engine==='native'){
await scanNative();
}else if(engine==='jsqr'){
scanWithJsQR();
}

}

}catch(e){

console.warn('QR scan error:',e);
hideLostBox();

}finally{

busy=false;

if(running){
timer=setTimeout(
scanLoop,
engine==='native'?65:45
);
}

}

}

// Mở camera sau.
async function start(){

if(running)return;

$('start').disabled=true;

setState('Đang mở camera…');

$('value').textContent='Đang khởi động camera sau…';

try{

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
'Hãy mở website bằng HTTPS trên Safari hoặc Chrome.'
);

}

// Cấu hình chung cho điện thoại, ưu tiên camera sau.
stream=await navigator.mediaDevices.getUserMedia({

audio:false,

video:{
facingMode:{ideal:'environment'},
width:{ideal:1280},
height:{ideal:720},
frameRate:{ideal:30}
}

});

video.srcObject=stream;

await new Promise((resolve,reject)=>{

if(video.readyState>=1)return resolve();

video.onloadedmetadata=resolve;

video.onerror=()=>{
reject(new Error('Không đọc được hình ảnh camera.'));
};

});

await video.play();

$('placeholder').classList.add('hidden');

// Chọn bộ giải mã sau khi camera đã mở.
await chooseEngine();

running=true;

setState(
engine==='native'?'Đang quét QR · Native':'Đang quét QR',
true
);

$('stop').disabled=false;

$('value').textContent='Đưa mã QR vào camera.';

scanLoop();

}catch(e){

console.error(e);

if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}

video.srcObject=null;

$('start').disabled=false;

setState('Chưa bật camera');

$('value').textContent=
e.name==='NotAllowedError'
?'Bạn chưa cho phép truy cập camera. Hãy bật quyền Camera cho website trong cài đặt Safari.'
:e.name==='NotFoundError'
?'Không tìm thấy camera trên thiết bị.'
:e.name==='NotReadableError'
?'Camera đang được ứng dụng khác sử dụng. Hãy đóng ứng dụng đó rồi thử lại.'
:(e.message||'Không thể mở camera.');

}

}

// Dừng camera.
function stop(){

running=false;

if(timer)clearTimeout(timer);
timer=0;

if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}

video.pause();
video.srcObject=null;

detector=null;
engine='';

$('placeholder').classList.remove('hidden');
$('start').disabled=false;
$('stop').disabled=true;

setState('Đã tắt camera');

$('value').textContent='Camera đã tắt.';

clearOverlay();

}

$('start').addEventListener('click',start);
$('stop').addEventListener('click',stop);

window.addEventListener('resize',()=>{
if(running)clearOverlay();
});

window.addEventListener('pagehide',()=>{
if(running)stop();
});

})();
</script>
</body>
</html>
